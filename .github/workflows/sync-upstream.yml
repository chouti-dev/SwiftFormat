# Sync chouti-dev/SwiftFormat with upstream SwiftFormat releases.

name: Sync upstream

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: Upstream version (e.g. 0.61.1). Leave blank for latest.
        type: string
        required: false
  schedule:
    - cron: "0 14 * * *" # every day at 14:00 UTC (6:00 PST, 7:00 PDT)

concurrency:
  group: sync-upstream-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Sync upstream
    runs-on: macos-latest
    steps:
      - name: Require release token
        run: |
          if [[ -z "${{ secrets.CHOUTI_RELEASE_TOKEN }}" ]]; then
            echo "::error::Add CHOUTI_RELEASE_TOKEN (fine-grained PAT: Contents + Actions + Workflows write, org authorized)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.CHOUTI_RELEASE_TOKEN }}

      - name: Sync upstream
        env:
          UPSTREAM_TAG: ${{ github.event.inputs.upstream_version }}
          GH_TOKEN: ${{ secrets.CHOUTI_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CHOUTI_RELEASE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x Scripts/chouti-sync-upstream.sh
          args=()
          if [[ -n "$UPSTREAM_TAG" ]]; then
            args+=(--upstream-tag "$UPSTREAM_TAG")
          fi
          ./Scripts/chouti-sync-upstream.sh "${args[@]}"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Upstream Sync"
            echo ""
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Upstream version | \`${{ github.event.inputs.upstream_version || 'latest' }}\` |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
